name: Deploy

# Monitored by Pipesor (pipeline 1 of 2). Deploys orders-api on the runner and probes its health check.
# A push to main that changes the deployment settings deploys again, which is how a fix made in the
# GitHub web editor produces the verification run of the remediation. Application code changes run
# the Tests workflow instead, so each fix re-runs only its own pipeline.

on:
  push:
    branches: [main]
    paths:
      - deploy/**
      - scripts/deploy.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy orders-api
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy and verify
        run: bash scripts/deploy.sh deploy/orders-api.env
