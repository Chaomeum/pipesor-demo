name: Demo reset

# Puts the demo back in its failing state: restores the wrong health check port on main.
# A commit made with GITHUB_TOKEN does not trigger Deploy. Run Deploy yourself afterwards
# (Actions -> Deploy -> Run workflow): a run started by GITHUB_TOKEN would not trigger the
# Pipesor report workflow. Do not register this workflow in Pipesor.

on:
  workflow_dispatch:

permissions: {}

concurrency: demo-reset

jobs:
  reset:
    name: reset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Restore the failing settings
        run: |
          set -euo pipefail
          sed -i 's|^HEALTHCHECK_URL=.*|HEALTHCHECK_URL=http://localhost:8081/health|' deploy/orders-api.env
          if git diff --quiet; then
            echo "deploy/orders-api.env already has the failing health check port"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore(demo): restore the failing health check port'
          git push origin HEAD:main

